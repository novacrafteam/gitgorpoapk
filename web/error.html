<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <title>Payment Error — GorphinAI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0e14;
      --card: #131822;
      --border: #232a3b;
      --text: #e6edf3;
      --muted: #8b949e;
      --danger: #f85149;
      --danger-bg: rgba(248, 81, 73, 0.12);
      --accent: #2f81f7;
      --accent-hover: #1f6feb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(24px, 6vw, 32px);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--danger-bg);
      color: var(--danger);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 10px; }
    p { font-size: 14.5px; line-height: 1.55; color: var(--muted); margin-bottom: 24px; }
    .details {
      display: none;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 22px;
      word-break: break-word;
    }
    .actions { display: flex; gap: 10px; justify-content: center; }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      width: 100%;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      background: var(--accent);
      color: #fff;
      transition: background 0.15s ease;
    }
    a.btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">!</div>
    <h1>Payment Failed</h1>
    <p>
      We could not complete your payment. No funds were charged, or the transaction was cancelled.
      Please try again or choose another payment method.
    </p>
    <div id="err-details" class="details"></div>
    <div class="actions">
      <a class="btn" href="/">Back to GorphinAI</a>
    </div>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const msg = params.get("error") || params.get("message") || params.get("reason");
      if (msg) {
        const el = document.getElementById("err-details");
        el.textContent = msg;
        el.style.display = "block";
      }
    })();
  </script>
</body>
</html>
